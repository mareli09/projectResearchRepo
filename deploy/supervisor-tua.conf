; Supervisor programs for the ICT Office server (CLAUDE.md §19). Paths assume /var/www/tua-repository.
[program:tua-queue]
command=php /var/www/tua-repository/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
user=www-data
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/var/www/tua-repository/storage/logs/queue.log

[program:tua-analytics]
; 1 worker, bound to localhost only. Memory is capped with MemoryMax in systemd (§11).
command=/var/www/tua-repository/analytics/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 1
directory=/var/www/tua-repository/analytics
environment=ANALYTICS_HMAC_SECRET="%(ENV_ANALYTICS_HMAC_SECRET)s",ANALYTICS_WARM_NLTK="1"
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/www/tua-repository/storage/logs/analytics.log
