# Nginx site for the ICT Office server (CLAUDE.md §19, §14 Security). Replace the server_name and
# certificate paths with the tua.edu.ph subdomain. Paths assume /var/www/tua-repository.
#
# PHP (php.ini for FPM): expose_php = Off, upload_max_filesize = 25M, post_max_size = 110M
# (five files of up to 20 MB in one submission), memory_limit = 256M.

server {
    listen 80;
    listen [::]:80;
    server_name repository.tua.edu.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name repository.tua.edu.ph;

    ssl_certificate     /etc/ssl/tua/fullchain.pem;
    ssl_certificate_key /etc/ssl/tua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/tua-repository/public;   # research files live in storage/, outside this root (§1 rule 9)
    index index.php;
    charset utf-8;
    client_max_body_size 110m;
    server_tokens off;

    # The app sends its own CSP and headers for every page. These cover static files Nginx serves directly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets have content hashes in their names: cache them for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # The service worker must not be cached long, so updates reach phones.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Nothing hidden (.env, .git) is ever served.
    location ~ /\.(?!well-known).* { deny all; }
}
