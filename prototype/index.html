<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TUA Research Repository</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
/* Layout: app shell — top bar with role switcher, role-specific side nav, scrolling work area. Navy + gold from the university's academic palette. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef2f7; --ink:#162033; --muted:#5a6579; --line:#dbe1ea;
  --accent:#1e3a6b; --accent-ink:#ffffff; --accent-soft:#e3eaf6; --gold:#b5862a; --gold-soft:#f6ecd6;
  --ok:#23744a; --ok-soft:#e2f2e8; --warn:#a66a10; --warn-soft:#fbefd9; --bad:#b0281c; --bad-soft:#fbe4e1;
  --c1:#1e3a6b; --c2:#b5862a; --c3:#3f8f86; --c4:#a4486a; --c5:#6a5fb0; --c6:#5f8a3a; --c7:#c2622d;
  --heat0:#eef2f7; --heat1:#1e3a6b; --bar:#1e3a6b; --bar-ink:#ffffff;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Serif",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --surface:#161e2d; --surface-2:#1c2638; --ink:#e5eaf2; --muted:#9aa6ba; --line:#2a3549;
  --accent:#8eb0ea; --accent-ink:#0e1420; --accent-soft:#1f2d48; --gold:#e0b45a; --gold-soft:#3a2f17;
  --ok:#62c18b; --ok-soft:#173326; --warn:#e8a94a; --warn-soft:#3a2b12; --bad:#f08a7e; --bad-soft:#3d1c19;
  --c1:#8eb0ea; --c2:#e0b45a; --c3:#5fc0b4; --c4:#e087aa; --c5:#a99ff0; --c6:#9ccc6e; --c7:#f0975e;
  --heat0:#1c2638; --heat1:#8eb0ea; --bar:#14213b; --bar-ink:#e5eaf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#161e2d; --surface-2:#1c2638; --ink:#e5eaf2; --muted:#9aa6ba; --line:#2a3549;
  --accent:#8eb0ea; --accent-ink:#0e1420; --accent-soft:#1f2d48; --gold:#e0b45a; --gold-soft:#3a2f17;
  --ok:#62c18b; --ok-soft:#173326; --warn:#e8a94a; --warn-soft:#3a2b12; --bad:#f08a7e; --bad-soft:#3d1c19;
  --c1:#8eb0ea; --c2:#e0b45a; --c3:#5fc0b4; --c4:#e087aa; --c5:#a99ff0; --c6:#9ccc6e; --c7:#f0975e;
  --heat0:#1c2638; --heat1:#8eb0ea; --bar:#14213b; --bar-ink:#e5eaf2; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-head);font-size:1.6rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.seal{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-head);font-size:.6rem;color:var(--gold);flex:none}
.brand small{display:block;font-weight:400;opacity:.8;font-size:.72rem}
.roles{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.roles button{background:transparent;border:1px solid color-mix(in srgb,var(--bar-ink) 30%,transparent);color:var(--bar-ink);padding:5px 10px;border-radius:999px;font-size:.78rem;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1b1406;font-weight:600}
.proto-tag{font-size:.7rem;background:var(--gold);color:#1b1406;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:.04em}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 52px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.side .who{padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side .who b{display:block;font-size:.9rem}
.side a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.88rem}
.side a:hover{background:var(--surface-2)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .grp{margin:12px 10px 4px}
.side .badge{font-size:.7rem;background:var(--gold-soft);color:var(--gold);padding:0 7px;border-radius:999px;font-weight:600}
main{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.panel>h2,.panel>.ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:.76rem;color:var(--muted)}
.kpi .d.up{color:var(--ok)}
.chart{width:100%;height:280px}
.chart.tall{height:360px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:.86rem;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);padding:8px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:500;color:var(--muted);min-width:0}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:.88rem;color:var(--ink);width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.err{color:var(--bad);font-size:.78rem}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}

.searchbar{display:flex;gap:8px}
.searchbar input{font-size:1rem;padding:10px 14px}
.layout-search{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.facet{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.facet:last-child{border-bottom:0}
.facet select{font-size:.82rem}
.result{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.result:last-child{border-bottom:0}
.result a.t{font-weight:600;font-size:.98rem;text-decoration:none;color:var(--ink)}
.result a.t:hover{color:var(--accent);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}

.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px;position:relative;padding-right:8px}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--muted);position:relative;z-index:1}
.step::before{content:"";position:absolute;top:10px;left:22px;right:0;height:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.done::before{background:var(--ok)}
.step.cur .dot{border-color:var(--gold);color:var(--gold)}
.step.ret .dot{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.step b{font-size:.82rem}
.step span{font-size:.74rem;color:var(--muted)}

.score{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.side-by-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
mark{background:var(--gold-soft);color:var(--ink);padding:0 2px;border-radius:2px}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.86rem;z-index:50;max-width:360px;box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.drawer-bg{position:fixed;inset:0;background:rgb(10 15 25 / .45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.callout{border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--surface);padding:12px 14px;border-radius:6px;font-size:.85rem}
.callout.info{border-left-color:var(--accent)}
.callout.bad{border-left-color:var(--bad)}
.callout.ok{border-left-color:var(--ok)}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;flex-wrap:wrap}
.slot.filled{border-style:solid;background:var(--surface-2)}
.slot input[type=file]{font-size:.78rem;max-width:230px}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.auth{max-width:420px;margin:30px auto;display:flex;flex-direction:column;gap:14px}
.screen-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.screen-map .panel a{display:block;padding:3px 0;text-decoration:none;font-size:.86rem}
.screen-map .panel a:hover{text-decoration:underline}
.mod-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.mod-row:last-child{border-bottom:0}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
/* LLM suggestions: always marked as suggestions, never applied without a click */
.ai-box{border:1px dashed var(--gold);background:color-mix(in srgb,var(--gold-soft) 55%,var(--surface));border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ai-tag{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:1px 7px;border-radius:4px;white-space:nowrap}
.sug{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:.8rem}
.sug.accepted{border-color:var(--ok);background:var(--ok-soft)}
.sug.rejected{opacity:.55;text-decoration:line-through}
.sug.edited{border-color:var(--accent);background:var(--accent-soft)}
.sug .btn{padding:1px 7px;font-size:.72rem}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:.85rem}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:700;flex:none;margin-top:1px;background:var(--ok);color:var(--surface)}
.checks .ic.wait{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.checks .ic.warn{background:var(--warn);color:var(--surface)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .fs{flex:1 1 130px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface-2);font-size:.78rem;display:flex;flex-direction:column;gap:2px;position:relative}
.flow .fs b{font-size:.8rem}
.flow .fs.ai{border-style:dashed;border-color:var(--gold);background:var(--gold-soft)}
.flow .fs.hu{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.arch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:.8rem}
.arch .box{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.arch .box.core{grid-column:2;grid-row:1/3;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.arch .box.ext{border-style:dashed;border-color:var(--gold)}
.arch .lnk{font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.notif{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.notif .dot2{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:7px}
.notif .dot2.read{background:var(--line)}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:.82rem;max-width:340px}
.cm div{padding:8px;border-radius:4px;text-align:center;background:var(--surface-2)}
.cm .h{background:transparent;color:var(--muted);font-size:.72rem;font-weight:600;padding:4px}
.cm .tp{background:var(--ok-soft);color:var(--ok);font-weight:600}
.cm .er{background:var(--bad-soft);color:var(--bad);font-weight:600}


/* ===== Public landing page (role "site") ===== */
body.is-site .shell{display:block}
body.is-site .side{display:none}
body.is-site main{padding:0}
body.is-site .wrap{max-width:none;gap:0}
.ls-in{max-width:1180px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.ls-nav{background:var(--surface);border-bottom:1px solid var(--line)}
.ls-nav .ls-in{padding-block:12px;display:flex;align-items:center;gap:20px}
.ls-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;line-height:1.2}
.ls-logo .seal{color:var(--accent);border-color:var(--accent);width:36px;height:36px;font-size:.66rem}
.ls-logo small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.ls-links{display:flex;gap:2px;margin-left:auto}
.ls-links a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.86rem}
.ls-links a:hover{background:var(--surface-2);color:var(--accent)}
.ls-cta{display:flex;gap:8px}
.ls-banner{background:var(--gold-soft);color:var(--ink);border-bottom:1px solid color-mix(in srgb,var(--gold) 30%,transparent);font-size:.86rem}
.ls-banner .ls-in{padding-block:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ls-banner .pill{background:var(--gold);color:#1b1406}
.ls-hero{background:
  radial-gradient(1200px 400px at 85% -10%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 60%),
  linear-gradient(160deg,var(--bar) 0%,color-mix(in srgb,var(--bar) 78%,#000) 100%);color:var(--bar-ink)}
.ls-hero .ls-in{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:72px}
.ls-hero .eyebrow{color:var(--gold);opacity:1}
.ls-hero h1{font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.1;margin:10px 0 14px;color:inherit}
.ls-hero p.lead{font-size:1.06rem;max-width:620px;opacity:.88}
.ls-search{display:flex;gap:8px;margin-top:24px;max-width:600px;background:var(--surface);padding:6px;border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .2)}
.ls-search input{border:0!important;font-size:1rem!important;padding:10px 12px!important;background:transparent!important}
.ls-search input:focus{outline:none}
.ls-search .btn{padding-inline:18px}
.ls-pop{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;font-size:.8rem;align-items:center}
.ls-pop a{color:var(--bar-ink);border:1px solid color-mix(in srgb,var(--bar-ink) 30%,transparent);padding:2px 10px;border-radius:999px;text-decoration:none}
.ls-pop a:hover{background:color-mix(in srgb,var(--bar-ink) 12%,transparent)}
.ls-hero .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1406}
.btn.ghost{background:transparent;color:var(--bar-ink);border-color:color-mix(in srgb,var(--bar-ink) 40%,transparent)}
.btn.ghost:hover{background:color-mix(in srgb,var(--bar-ink) 10%,transparent)}

<script>
/* ================= seeded random ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261119);
const pick=a=>a[Math.floor(rnd()*a.length)];
const wpick=(items,weights)=>{let s=weights.reduce((a,b)=>a+b,0),r=rnd()*s;for(let i=0;i<items.length;i++){r-=weights[i];if(r<=0)return items[i]}return items[items.length-1]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en-US');

/* ================= reference data ================= */
const COLLEGES=[
 {code:'CAHS',name:'College of Allied Health Sciences',cluster:2,programs:['BS Physical Therapy','BS Pharmacy','BS Radiologic Technology']},
 {code:'CASE',name:'College of Arts, Sciences and Education',cluster:4,programs:['BS Psychology','BSEd English','AB Communication','BS Biology']},
 {code:'IBAM',name:'Institute of Business and Management',cluster:1,programs:['BSBA Marketing','BS Accountancy','BS Hospitality Management']},
 {code:'CEIS',name:'College of Engineering and Information Sciences',cluster:1,programs:['BS Information Technology','BS Computer Science','BS Computer Engineering','BS Civil Engineering']},
 {code:'CMT',name:'College of Medical Technology',cluster:2,programs:['BS Medical Technology']},
 {code:'SLCN',name:"St. Luke's College of Nursing",cluster:3,programs:['BS Nursing','Master of Arts in Nursing']},
];
const CLUSTERS={1:'Cluster 1 · Business and Technology',2:'Cluster 2 · Health: Diagnostic and Pharmaceutical',3:'Cluster 3 · Health: Patient Care',4:'Cluster 4 · Social Science, Humanities, and Science'};

const TYPES=['Undergraduate thesis','Capstone project','Graduate thesis','Faculty research'];
const THEMES=[
 {id:1,label:'Health informatics and digital care',terms:['health','patient','telemedicine','record','clinic'],sdg:[3,9],
  subj:['Electronic Health Record Adoption','Telemedicine Readiness','Patient Queue Management','Health Information Privacy Awareness','Mobile Medication Reminders','Online Appointment Scheduling','Digital Prescription Tracking'],
  ctx:['among Barangay Health Centers in Quezon City','in a Tertiary Hospital in Metro Manila','for Outpatient Clinics','among Senior Citizens','in Private Clinics in Cubao','among Rural Health Units','for Pharmacy Services']},
 {id:2,label:'Nursing practice and community health',terms:['nursing','care','community','maternal','wellbeing'],sdg:[3,5],
  subj:['Maternal Health Practices','Burnout and Coping Strategies','Hand Hygiene Compliance','Breastfeeding Self-Efficacy','Fall Prevention Practices','Mental Health Literacy','Post-Operative Pain Management'],
  ctx:['among Staff Nurses in Quezon City','of First-Time Mothers','in Community Health Settings','among Student Nurses','in Medical-Surgical Wards','of Family Caregivers','among Elderly Residents']},
 {id:3,label:'Machine learning and decision support',terms:['machine','learning','prediction','classification','algorithm'],sdg:[9,4],
  subj:['Student Dropout Prediction','Sentiment Classification of Course Evaluations','Crop Disease Detection','Flood Risk Prediction','Document Classification','Fake News Detection','Enrollment Forecasting'],
  ctx:['Using Random Forest','Using Naive Bayes','Using Convolutional Neural Networks','Using Decision Trees','Using K-Means Clustering','Using Support Vector Machines','Using Logistic Regression']},
 {id:4,label:'Web and mobile information systems',terms:['system','web','mobile','management','application'],sdg:[9,16],
  subj:['Web-Based Inventory Management System','Mobile Attendance Monitoring Application','Online Clearance Processing System','Barangay Records Management System','Library Reservation System','Event Ticketing Platform','Alumni Tracer System'],
  ctx:['for a University in Quezon City','for Small Retail Stores','with QR Code Integration','for Local Government Units','with SMS Notification','for Student Organizations','with Role-Based Access']},
 {id:5,label:'Business, marketing and MSMEs',terms:['business','marketing','consumer','msme','financial'],sdg:[8,12],
  subj:['Social Media Marketing Effectiveness','Consumer Buying Behavior','Financial Literacy','Digital Payment Adoption','Customer Satisfaction','Employee Retention Factors','Food Service Quality'],
  ctx:['among MSMEs in Cubao','of Generation Z Consumers','among Online Sellers','in Fast-Food Chains','among Hotel Employees','of Milk Tea Shops','among Sari-Sari Store Owners']},
 {id:6,label:'Education and learning outcomes',terms:['learning','students','teaching','education','academic'],sdg:[4,5],

 {id:7,label:'Laboratory diagnostics and public health',terms:['laboratory','specimen','diagnostic','bacterial','screening'],sdg:[3,6],
  subj:['Antibacterial Activity of Plant Extracts','Water Quality Assessment','Prevalence of Intestinal Parasites','Blood Glucose Screening','Antibiotic Resistance Patterns','Specimen Rejection Rates','Dengue Seroprevalence'],

];
// how likely each college writes on each theme (theme x college order CAHS,CASE,IBAM,CEIS,CMT,SLCN)
const AFF={1:[5,1,1,4,2,3],2:[2,1,0,0,1,9],3:[1,2,1,6,1,0],4:[1,1,2,9,0,0],5:[0,1,9,1,0,0],6:[1,9,1,1,0,1],7:[3,2,0,0,9,1]};
const FIRST=['Andrea','Bea','Carlo','Danica','Enzo','Francine','Gabriel','Hannah','Isaac','Janelle','Kevin','Leah','Miguel','Nicole','Oscar','Patricia','Rafael','Sofia','Tristan','Unice','Vince','Wendy','Xandra','Yuri','Zoe','Joshua','Katrina','Lance','Mika','Paolo'];
const LAST=['Aquino','Bautista','Cruz','Dela Rosa','Espiritu','Fernandez','Garcia','Hernandez','Ilagan','Javier','Lim','Mendoza','Navarro','Ocampo','Pascual','Quiambao','Ramos','Santos','Tolentino','Uy','Villareal','Yap','Zamora','Manalastas','Soriano'];

/* ================= generate repository ================= */
const RECORDS=[];
(function gen(){
  const combos={};
  THEMES.forEach(t=>{const c=[];PREFIX.forEach(p=>t.subj.forEach(s=>t.ctx.forEach(x=>c.push([p,s,x]))));combos[t.id]=shuffle(c)});

      views:Math.floor(rnd()*rnd()*900)+5, downloads:Math.floor(rnd()*rnd()*240),

      x:0,y:0, status:'Published'

  }
  // planted near-duplicates for the screening demo
  RECORDS.push({id:'TUA-2023-1420',title:'Capstone Proposal Title Similarity Checker Using TF-IDF and Cosine Similarity',theme:3,college:'CEIS',program:'BS Information Technology',year:2023,type:'Capstone project',degree:'Undergraduate',adviser:'Dr. Evelyn Sarmiento',authors:['Mika Santos','Lance Uy','Danica Ocampo'],keywords:['tf-idf','cosine similarity','capstone','title screening'],sdg:[9,4],views:412,downloads:96,fullText:true,status:'Published'});
  RECORDS.push({id:'TUA-2022-1421',title:'Detecting Duplicate Research Titles in a University Library Using Text Similarity',theme:3,college:'CEIS',program:'BS Computer Science',year:2022,type:'Undergraduate thesis',degree:'Undergraduate',adviser:'Prof. Dennis Galang',authors:['Kevin Ramos','Bea Javier'],keywords:['duplicate detection','text similarity','research titles','library'],sdg:[9],views:288,downloads:51,fullText:true,status:'Published'});
  RECORDS.push({id:'TUA-2024-1422',title:'Web-Based Thesis Archive with Keyword Search for the College of Engineering and Information Sciences',theme:4,college:'CEIS',program:'BS Information Technology',year:2024,type:'Capstone project',degree:'Undergraduate',adviser:'Prof. Ramon Castillo',authors:['Sofia Lim','Tristan Pascual'],keywords:['thesis archive','keyword search','repository','web-based'],sdg:[4,9],views:356,downloads:73,fullText:true,status:'Published'});

const statusPill=s=>{const m={Draft:'',Submitted:'info',Endorsed:'gold',Reviewed:'gold',Published:'ok',Returned:'bad',Rejected:'bad'};return `<span class="pill ${m[s]||''}">${s==='Endorsed'?'Endorsed by adviser':s==='Reviewed'?'Reviewed by coordinator':s}</span>`};
const flagPill=sc=>{const f=flagOf(sc);return `<span class="pill ${f.k}">${f.t}</span>`};
function scoreBar(sc){const f=flagOf(sc);const col=f.k==='bad'?'var(--bad)':f.k==='warn'?'var(--warn)':'var(--ok)';return `<div class="score"><span class="mono">${sc.toFixed(2)}</span><div class="bar"><i style="width:${Math.min(100,sc*100)}%;background:${col}"></i></div></div>`}
function stepper(sub){
  const ret=sub.status==='Returned'||sub.status==='Rejected';
  return `<div class="steps">${STEPS.map((s,i)=>{const n=i+1;let cls=n<=sub.step&&!ret?'done':'';if(ret&&n===sub.step+1)cls='ret';if(!ret&&n===sub.step+1)cls='cur';if(ret&&n<=sub.step)cls='done';
   const h=sub.history.find(x=>x[0]===['Submitted','Endorsed','Reviewed','Published'][i]);
   return `<div class="step ${cls}"><div class="dot">${cls==='done'?'✓':cls==='ret'?'!':n}</div><b>${s}</b><span>${h?esc(h[2]):cls==='ret'?'Returned':cls==='cur'?'Waiting':'—'}</span></div>`}).join('')}</div>`}
function recordRow(r,extra=''){return `<div class="result"><a class="t" href="javascript:void 0" onclick="openRecord('${r.id}')">${esc(r.title)}</a><div class="meta"><span>${esc(r.authors.join(', '))}</span><span>${r.college} · ${esc(r.program)}</span><span>${r.year}</span><span>${r.type}</span></div><p class="small muted">${esc(r.abstract.slice(0,190))}…</p><div class="chips">${r.keywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}<span class="chip" style="border-color:transparent;background:var(--accent-soft);color:var(--accent)">Theme: ${esc(LABELS[r.theme-1].label)}</span></div>${extra}</div>`}

function searchView(opts){
  const pub=!!opts.publicOnly;
  return {html:()=>`

  ${pub?`<div class="callout info">Guests can read titles and abstracts of approved studies. Full papers need a TUA account and are released according to URDC policy.</div>`:''}
  <form class="searchbar" onsubmit="event.preventDefault();S.q=document.getElementById('q').value;runSearch()"><input type="search" id="q" placeholder="Search titles, abstracts and keywords" value="${esc(S.q)}" aria-label="Search"><button class="btn primary">Search</button></form>
  <div class="layout-search">
    <aside class="panel" style="padding:8px 14px">${facet('college','College',COLLEGES.map(c=>[c.code,c.code]))}${facet('year','Year',[2025,2024,2023,2022,2021,2020,2019,2018].map(y=>[y,y]))}${facet('type','Type',TYPES.map(t=>[t,t]))}${facet('theme','Theme',LABELS.map(l=>[l.id,l.label]))}${facet('sdg','SDG',Object.entries(SDGS).map(([k,v])=>[k,'SDG '+k+' '+v]))}${facet('adviser','Adviser',[...new Set(Object.values(ADVISERS).flat())].sort().map(a=>[a,a]))}
      <div class="facet"><button class="btn sm" type="button" onclick="S.filters={};S.q='';render()">Clear filters</button></div></aside>
    <section class="panel" style="padding-block:6px"><div id="results"></div></section>
  </div>`,after:()=>runSearch()}}
function facet(k,label,opts){return `<div class="facet"><label class="f" for="f-${k}">${label}<select id="f-${k}" onchange="S.filters.${k}=this.value;runSearch()"><option value="">All</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(S.filters[k]||'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></label></div>`}
function runSearch(){
  const q=tok(S.q||''),f=S.filters;
  let res=RECORDS.filter(r=>r.status==='Published'&&(!f.college||r.college===f.college)&&(!f.year||r.year==f.year)&&(!f.type||r.type===f.type)&&(!f.theme||r.theme==f.theme)&&(!f.sdg||r.sdg.includes(+f.sdg))&&(!f.adviser||r.adviser===f.adviser));
  if(q.length){res=res.map(r=>{const t=tok(r.title+' '+r.keywords.join(' ')+' '+r.abstract);const hit=q.filter(w=>t.includes(w)).length;return{r,hit}}).filter(x=>x.hit).sort((a,b)=>b.hit-a.hit||b.r.views-a.r.views).map(x=>x.r)}
  else res=res.sort((a,b)=>b.year-a.year||b.views-a.views);
  if(S.q)logEvent('search',`Searched "${S.q}" (${res.length} results)`);
  document.getElementById('results').innerHTML=`<div class="ph" style="padding-top:10px"><span class="muted small">${fmt(res.length)} studies${S.q?` for “${esc(S.q)}”`:''}</span><span class="muted small">Sorted by relevance</span></div>`+(res.length?res.slice(0,12).map(r=>recordRow(r)).join(''):`<p class="muted" style="padding:20px 0">No studies match. This search is logged so the URDC can see gaps in the collection.</p>`)+(res.length>12?`<p class="muted small" style="padding:10px 0">Showing 12 of ${fmt(res.length)}.</p>`:'');
}

function requestAccess(id){ACCESS_REQ.unshift({id:'AR-0'+(32+ACCESS_REQ.length-4),who:USERS[S.role].name,role:USERS[S.role].sub.split(' · ').slice(0,2).join(' · '),rec:id,purpose:'Review of related literature',date:'Nov 26, 2026',status:'Pending'});logEvent('request','Requested full paper of '+id);notify('urdc','Full-paper access request',USERS[S.role].name+' requested the full paper of '+id+'.');toast('Access request sent to the URDC. You will get an email when it is decided.')}
/* ---------- charts ---------- */
function tk(){const s=getComputedStyle(document.documentElement);return n=>s.getPropertyValue('--'+n).trim()}
function palette(){const t=tk();return[1,2,3,4,5,6,7].map(i=>t('c'+i))}
function mk(id,opt,onClick){const el=document.getElementById(id);if(!el||!window.echarts)return;const t=tk();
  const base={textStyle:{fontFamily:'IBM Plex Sans, system-ui, sans-serif',color:t('muted')},color:palette(),grid:{left:8,right:16,top:28,bottom:8,containLabel:true},
   tooltip:{backgroundColor:t('surface'),borderColor:t('line'),textStyle:{color:t('ink'),fontSize:12}},animationDuration:500};
  const ax=a=>a&&[].concat(a).map(x=>Object.assign({axisLine:{lineStyle:{color:t('line')}},axisTick:{show:false},splitLine:{lineStyle:{color:t('line'),type:'dashed'}},axisLabel:{color:t('muted')}},x));
  if(opt.xAxis)opt.xAxis=ax(opt.xAxis);if(opt.yAxis)opt.yAxis=ax(opt.yAxis);
  if(opt.legend)opt.legend=Object.assign({textStyle:{color:t('muted')},top:0,icon:'roundRect',itemWidth:10,itemHeight:10},opt.legend);
  const c=echarts.init(el,null,{renderer:'svg'});c.setOption(Object.assign(base,opt));if(onClick)c.on('click',onClick);CHARTS.push(c);}
addEventListener('resize',()=>CHARTS.forEach(c=>c.resize()));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function countBy(arr,f){const m={};arr.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return m}

function analyticsAfter(scope,full){
  const F=S.anFilter;
  const base=RECORDS.filter(r=>scope.includes(r.college)&&(!F.college||r.college===F.college)&&(!F.theme||r.theme==F.theme)&&(!F.sdg||r.sdg.includes(+F.sdg)));
  const recs=base.filter(r=>!F.year||r.year==F.year);
  const thisYr=base.filter(r=>r.year===2025).length,lastYr=base.filter(r=>r.year===2024).length;
  const kpis=[['Total outputs',fmt(recs.length),'in the repository'],['Outputs in 2025',fmt(thisYr),'calendar year'],['Growth rate',(lastYr?((thisYr-lastYr)/lastYr*100).toFixed(1):'0')+'%','2025 vs 2024','up'],['Active users',fmt(Math.round(612*recs.length/1422)),'last 30 days'],['Downloads',fmt(recs.reduce((a,r)=>a+r.downloads,0)),'all time']];

  const t=tk();
  // trend
  const years=[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];const yc=countBy(base,r=>r.year);const ys=years.map(y=>yc[y]||0);
  const n=years.length,mx=(n-1)/2,my=ys.reduce((a,b)=>a+b,0)/n;let num=0,den=0;ys.forEach((y,i)=>{num+=(i-mx)*(y-my);den+=(i-mx)**2});const sl=num/den;
  mk('ch-trend',{tooltip:{trigger:'axis'},xAxis:{type:'category',data:years},yAxis:{type:'value'},series:[{name:'Outputs',type:'line',data:ys,smooth:.2,symbolSize:7,areaStyle:{opacity:.12},lineStyle:{width:2.5},itemStyle:{color:t('c1')}},{name:'Trend',type:'line',data:ys.map((_,i)=>+(my+sl*(i-mx)).toFixed(1)),symbol:'none',lineStyle:{type:'dashed',color:t('c2'),width:1.5},tooltip:{show:false}}]},
    p=>p.seriesIndex===0&&drill(`Outputs in ${p.name}`,base.filter(r=>r.year==p.name)));

  // scatter

  const kc={};recs.filter(r=>r.year>=2023).forEach(r=>r.keywords.forEach(k=>kc[k]=(kc[k]||0)+1));const kk=Object.keys(kc).sort((a,b)=>kc[b]-kc[a]).slice(0,10);
  mk('ch-kw',{tooltip:{},xAxis:{type:'value'},yAxis:{type:'category',inverse:true,data:kk},series:[{type:'bar',barMaxWidth:16,data:kk.map(k=>kc[k]),itemStyle:{color:t('c2')}}]},p=>drill(`Keyword: ${p.name}`,recs.filter(r=>r.keywords.includes(p.name))));
  // adviser load
  const ac=countBy(recs.filter(r=>r.year>=2023),r=>r.adviser);const ak=Object.keys(ac).sort((a,b)=>ac[b]-ac[a]).slice(0,8);
  mk('ch-adv',{tooltip:{},xAxis:{type:'value'},yAxis:{type:'category',inverse:true,data:ak},series:[{type:'bar',barMaxWidth:16,data:ak.map(k=>ac[k]),itemStyle:{color:t('c5')}}]},p=>drill(`Adviser: ${p.name} (2023–2025)`,recs.filter(r=>r.adviser===p.name&&r.year>=2023)));
  // screening
  mk('ch-screen',{tooltip:{trigger:'axis'},legend:{},grid:{left:8,right:16,top:36,bottom:8,containLabel:true},xAxis:{type:'category',data:['Jun','Jul','Aug','Sep','Oct','Nov']},yAxis:{type:'value'},series:[{name:'Original',type:'bar',stack:'s',data:[18,22,31,40,29,15],itemStyle:{color:t('ok')}},{name:'Needs review',type:'bar',stack:'s',data:[3,4,6,5,4,3],itemStyle:{color:t('warn')}},{name:'Probable duplicate',type:'bar',stack:'s',data:[1,0,2,1,1,1],itemStyle:{color:t('bad')}}]});
  // compliance
  document.getElementById('compliance').innerHTML=cols.map(c=>{const ex=recs.filter(r=>r.college===c).length;const ok=recs.filter(r=>r.college===c&&r.fullText).length;const p=ex?ok/ex*100:0;return `<tr class="click" onclick="drill('${c} · records missing files',RECORDS.filter(r=>r.college==='${c}'&&!r.fullText))"><td>${c}</td><td class="r num">${fmt(ex)}</td><td class="r num">${fmt(ok)}</td><td><div class="score"><span class="num small">${p.toFixed(0)}%</span><div class="bar"><i style="width:${p}%;background:${p>=85?'var(--ok)':'var(--warn)'}"></i></div></div></td></tr>`}).join('');
  if(full){
    const wk=Array.from({length:12},(_,i)=>'W'+(i+36));
    mk('ch-usage',{tooltip:{trigger:'axis'},legend:{},grid:{left:8,right:16,top:36,bottom:8,containLabel:true},xAxis:{type:'category',data:wk},yAxis:{type:'value'},series:[{name:'Views',type:'line',smooth:.2,data:[820,910,880,1010,1190,1240,1105,1320,1415,1380,1502,1610]},{name:'Searches',type:'line',smooth:.2,data:[540,600,610,700,820,860,790,910,990,960,1040,1120]},{name:'Downloads',type:'bar',barMaxWidth:14,data:[120,140,130,160,190,200,180,215,240,230,250,268]}]});
    document.getElementById('topacc').innerHTML=[...recs].sort((a,b)=>b.views-a.views).slice(0,6).map(r=>`<div><div class="ph"><a href="javascript:void 0" onclick="openRecord('${r.id}')">${esc(r.title)}</a><span class="num small muted">${fmt(r.views)} views</span></div></div>`).join('');
  }
}

function hex2hsl(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,Sa=0;const L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;Sa=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return[H,Sa,L]}
const hsl=(h,s,l)=>`hsl(${h.toFixed(0)} ${(s*100).toFixed(0)}% ${(l*100).toFixed(0)}%)`;
function effectiveColor(){const s=site();return (s.theme.allowUser&&USERTHEME.color)||s.theme.color}
function applyTheme(){
  const [h,s0,l0]=hex2hsl(effectiveColor());const s=Math.min(s0,.75);
  const L=Math.min(l0,.36), A=hsl(h,s,L);
  const light=`--accent:${A};--accent-soft:${hsl(h,Math.min(s,.55),.93)};--bar:${A};--c1:${A};--heat1:${A};`;
  const dA=hsl(h,Math.min(s+.1,.7),.74);
  const dark=`--accent:${dA};--accent-soft:${hsl(h,Math.min(s,.45),.2)};--bar:${hsl(h,Math.min(s,.5),.14)};--c1:${dA};--heat1:${dA};`;
  let el=document.getElementById('theme-style');if(!el){el=document.createElement('style');el.id='theme-style';document.head.appendChild(el)}
  el.textContent=`:root{${light}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
  const mode=USERTHEME.mode||'';const cur=document.documentElement.getAttribute('data-theme')||'';
  if(cur!==mode){if(mode)document.documentElement.setAttribute('data-theme',mode);else document.documentElement.removeAttribute('data-theme')}
}

function cmsList(p,act,i,blank){const a=getP(DRAFT,p);
 if(act==='up'&&i>0)[a[i-1],a[i]]=[a[i],a[i-1]];
 if(act==='down'&&i<a.length-1)[a[i+1],a[i]]=[a[i],a[i+1]];

function fpFind(e){e.preventDefault();const em=document.getElementById('fp-email').value.trim().toLowerCase();if(!/@tua\.edu\.ph$/.test(em)){document.getElementById('fp-err').textContent='Use your @tua.edu.ph address.';return false}S.fp={step:2,email:em};render();return false}
function fpSend(e){e.preventDefault();const v=document.querySelector('input[name=fp-via]:checked').value;const lbl={tua:mask(S.fp.email),email:mask(RECOVERY.email),sms:mask(RECOVERY.mobile)}[v];
 S.fp.via=v;S.fp.viaLabel=lbl;S.fp.code=String(100000+Math.floor(Math.random()*899999));S.fp.step=3;logEvent('recovery',`Recovery code sent by ${v==='sms'?'SMS':'email'} to ${lbl} for ${S.fp.email}`);render();return false}
function fpReset(e){e.preventDefault();const c=document.getElementById('fp-code').value.trim(),p=document.getElementById('fp-pass').value,err=document.getElementById('fp-err');
 if(c!==S.fp.code){err.textContent='That code is not correct. After 5 wrong tries the code stops working.';return false}
 if(p.length<10||!/[A-Za-z]/.test(p)||!/\d/.test(p)){err.textContent='Use at least 10 characters, with a letter and a number.';return false}
 S.fp.step=4;logEvent('recovery','Password reset with code via '+(S.fp.via==='sms'?'recovery mobile':S.fp.via==='email'?'recovery email':'TUA email')+' for '+S.fp.email);render();return false}
function fpNoAccess(){drawer('Assisted account recovery',`<p class="small">If you can't reach your TUA mailbox or your recovery contacts, ask for help from the URDC (students and faculty) or the system administrator.</p>
 <ol class="small" style="padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>Email or visit the office listed under <b>Account help</b> on the home page.</li><li>Show a valid school ID or government ID. The office checks it against the account.</li><li>The administrator updates your recovery contact and sends a one-time reset link to it. You set your own password. Staff never see or set it.</li><li>The request, the check and the change are written to the activity log.</li></ol>`)}

function accountView(role){return {html:()=>{const u=USERS[role];const R=RECOVERY;const pill=ok=>ok?'<span class="pill ok">Verified</span>':'<span class="pill warn">Not verified</span>';
 return `<div class="head"><div><div class="eyebrow">M1 · My account</div><h1>Account and recovery</h1><p class="muted small" style="margin-top:4px">Add a personal email or a mobile number so you can get back into your account if you lose access to your TUA mailbox, for example after you graduate.</p></div></div>
 <div class="grid g2">
  <section class="panel"><h2>Sign-in</h2><div class="list"><div><span class="eyebrow">TUA email</span><div class="mono">${esc(u.email)}</div></div><div><span class="eyebrow">Password</span><div class="ph"><span>Last changed Oct 2, 2026</span><a class="btn sm" href="#guest-forgot">Change</a></div></div><div><span class="eyebrow">Theme</span><div class="ph"><span>Pick a color and light or dark mode</span><button class="btn sm" onclick="toggleThemePop();event.stopPropagation()">Theme</button></div></div></div></section>
  <section class="panel"><h2>Recovery contacts</h2><p class="small muted" style="margin:-4px 0 12px">Used only for account recovery and security notices, never for marketing. Each one must be verified with a code before it can be used.</p>
   <div class="cms-fields">
    <div class="cms-item"><div class="ph"><b>Recovery email</b>${R.email?pill(R.emailOk):''}</div><label class="f" for="ac-email">Personal email (not @tua.edu.ph)<input type="email" id="ac-email" value="${esc(R.email)}" placeholder="name@gmail.com"></label><div class="inline-confirm" style="margin:0"><button class="btn sm primary" onclick="acSave('email')">Save and send code</button>${R.email?`<button class="btn sm bad" onclick="acRemove('email')">Remove</button>`:''}</div><div id="ac-email-v"></div></div>
    <div class="cms-item"><div class="ph"><b>Recovery mobile number</b>${R.mobile?pill(R.mobileOk):''}</div><label class="f" for="ac-mobile">Philippine mobile number<input type="text" inputmode="tel" id="ac-mobile" value="${esc(R.mobile)}" placeholder="09XX XXX XXXX"></label><div class="inline-confirm" style="margin:0"><button class="btn sm primary" onclick="acSave('mobile')">Save and send code</button>${R.mobile?`<button class="btn sm bad" onclick="acRemove('mobile')">Remove</button>`:''}</div><div id="ac-mobile-v"></div></div>
    <div id="ac-err" class="err" role="alert"></div>
   </div></section>
 </div>
 <section class="panel"><h2>Recent security activity</h2><div class="tbl" style="margin-top:8px"><table><thead><tr><th>When</th><th>Event</th></tr></thead><tbody>${AUDIT.filter(a=>a.event==='recovery'||a.event==='login').slice(0,5).map(a=>`<tr><td class="small mono">${a.t.toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'Asia/Manila'})}</td><td class="small">${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div></section>`}}}
let AC_CODE={};
function acSave(k){const el=document.getElementById('ac-'+k),err=document.getElementById('ac-err');let v=el.value.trim();err.textContent='';
 if(k==='email'&&!isPersonalEmail(v)){err.textContent='Enter a personal email address. Your TUA address can’t be its own recovery email.';return}
 if(k==='mobile'){if(!isMobile(v)){err.textContent='Enter a Philippine mobile number, for example 0917 123 4567.';return}v=normMobile(v)}
 AC_CODE[k]=String(100000+Math.floor(Math.random()*899999));
 document.getElementById('ac-'+k+'-v').innerHTML=`<div class="inline-confirm"><span class="small">Code sent to <b>${esc(mask(v))}</b> <span class="muted">(prototype: <span class="mono">${AC_CODE[k]}</span>)</span></span><input type="text" id="ac-${k}-c" maxlength="6" inputmode="numeric" style="max-width:110px" placeholder="6 digits"><button class="btn sm" onclick="acVerify('${k}','${esc(v)}')">Verify</button></div>`;
 logEvent('recovery',`Verification code sent to new recovery ${k} ${mask(v)}`)}
function acVerify(k,v){const c=document.getElementById('ac-'+k+'-c').value.trim();if(c!==AC_CODE[k]){document.getElementById('ac-err').textContent='That code is not correct.';return}
 RECOVERY[k]=v;RECOVERY[k+'Ok']=true;store.set('tua-recovery',RECOVERY);logEvent('recovery',`Recovery ${k} changed to ${mask(v)} and verified`);notify(S.role,'Your recovery '+k+' was changed','If this wasn’t you, contact the URDC right away.');toast('Recovery '+k+' verified and saved.');render()}
function acRemove(k){RECOVERY[k]='';RECOVERY[k+'Ok']=false;store.set('tua-recovery',RECOVERY);logEvent('recovery','Removed recovery '+k);render()}
['student','adviser','coordinator','urdc','sysadmin'].forEach(r=>VIEWS[r+'-account']=accountView(r));

addEventListener('hashchange',()=>{closeThemePop();render()});
render();
</script>
